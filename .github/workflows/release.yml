name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generar zip
        run: python build.py

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          files: PolyCutter-*.zip
          generate_release_notes: true
